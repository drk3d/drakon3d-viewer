<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Coloris Test Sandbox</title>
  <link rel="stylesheet" href="libs/coloris.min.css">
  <script src="libs/coloris.min.js"></script>
  <style>
    body {
      background: #121214;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.5rem;
      color: #818cf8;
      margin-bottom: 20px;
      border-bottom: 1px solid #2d3748;
      padding-bottom: 10px;
    }
    .test-box {
      background: #1e1e24;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .layer-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #272730;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #3b3b4f;
    }
    .log-panel {
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 15px;
      font-family: monospace;
      font-size: 0.85rem;
      color: #34d399;
      height: 150px;
      overflow-y: auto;
    }
    .btn {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      align-self: flex-start;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #4338ca;
    }

    /* Coloris CAD Swatch Style Override (same as style.css) */
    .clr-field {
      width: 24px !important;
      height: 24px !important;
      border-radius: 4px !important;
      border: 1px solid rgba(255, 255, 255, 0.18) !important;
      flex-shrink: 0 !important;
      cursor: pointer !important;
      display: inline-block !important;
      position: relative !important;
      margin: 0 !important;
      padding: 0 !important;
      box-sizing: border-box !important;
    }
    .clr-field button {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      border-radius: 3px !important;
      border: none !important;
      box-shadow: none !important;
      cursor: pointer !important;
      padding: 0 !important;
      margin: 0 !important;
      pointer-events: auto !important; /* Enable clicks */
    }
    .clr-field input {
      position: absolute !important;
      width: 0 !important;
      height: 0 !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body>

  <h1>🎨 Coloris Integration Diagnostic</h1>
  
  <div class="test-box">
    <h3>Dynamic CAD Layers Simulator</h3>
    <p style="font-size: 0.85rem; color: #94a3b8; margin: 0 0 10px 0;">
      Click "Add Dynamic Layer" to add a new layer item and call <code>Coloris.wrap()</code>. Click the color boxes below to test.
    </p>
    
    <div id="layers-container" style="display: flex; flex-direction: column; gap: 8px;">
      <!-- Dynamic layers will be appended here -->
    </div>
    
    <button id="btn-add-layer" class="btn">➕ Add Dynamic Layer</button>
  </div>

  <h3>🔍 Event & Console Log</h3>
  <div id="log" class="log-panel">System ready. Click "Add Dynamic Layer" to begin testing...</div>

  <script>
    const logEl = document.getElementById('log');
    const container = document.getElementById('layers-container');
    const addBtn = document.getElementById('btn-add-layer');

    function log(msg) {
      const time = new Date().toLocaleTimeString();
      logEl.innerHTML += `<div>[${time}] ${msg}</div>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    // Configure Coloris globally
    if (window.Coloris) {
      log("Initializing Coloris global configuration...");
      Coloris({
        el: '.layer-color-picker-input',
        theme: 'default',
        themeMode: 'dark',
        alpha: false,
        format: 'hex',
        swatches: [
          '#4F46E5', '#10B981', '#F59E0B', '#EF4444', '#06B6D4', '#8B5CF6',
          '#EC4899', '#F97316', '#22C55E', '#3B82F6', '#6366F1', '#14B8A6'
        ]
      });
      log("Coloris configured successfully.");
    } else {
      log("❌ ERROR: Coloris library (coloris.min.js) is not loaded!");
    }

    let layerCount = 0;
    const defaultColors = ['#4F46E5', '#10B981', '#F59E0B', '#EF4444', '#06B6D4', '#8B5CF6'];

    function addLayer() {
      layerCount++;
      const color = defaultColors[(layerCount - 1) % defaultColors.length];
      const layerId = `layer-${layerCount}`;

      const div = document.createElement('div');
      div.className = 'layer-item';
      div.innerHTML = `
        <input type="text" class="layer-color-picker-input" data-coloris data-index="${layerCount}" value="${color}" inputmode="none"
               style="width:24px; height:24px; border-radius:4px; border:1px solid rgba(255,255,255,0.18); cursor:pointer;
                      background:${color}; color:transparent; outline:none; flex-shrink:0; box-sizing:border-box; font-size:0; caret-color:transparent;">
        <span style="font-size: 0.9rem; font-weight: 500;">Layer ${layerCount}</span>
        <span id="label-${layerId}" style="font-size: 0.8rem; color: #94a3b8; margin-left: auto;">(${color})</span>
      `;

      container.appendChild(div);
      log(`Created Layer ${layerCount} with color ${color}`);

      // Bind input listener to see if Coloris fires it
      const input = div.querySelector('.layer-color-picker-input');
      input.addEventListener('input', e => {
        const hex = e.target.value;
        const idx = e.target.dataset.index;
        
        // Synchronize visual swatch color
        const wrapper = e.target.parentNode;
        if (wrapper && wrapper.classList.contains('clr-field')) {
          wrapper.style.color = hex;
        }
        
        document.getElementById(`label-layer-${idx}`).textContent = `(${hex})`;
        log(`🌈 Layer ${idx} input event fired! New color: <span style="color:${hex}">${hex}</span>`);
      });

      // Wrap the newly created input
      if (window.Coloris) {
        Coloris.wrap('.layer-color-picker-input');
        log(`Wrapped input for Layer ${layerCount} using Coloris.wrap()`);
      }
    }

    addBtn.addEventListener('click', addLayer);

    // Add first layer by default
    addLayer();

    // Log global events
    document.addEventListener('coloris:pick', e => {
      log(`🎯 Global event [coloris:pick] fired! Color: ${e.detail.color}`);
    });
  </script>
</body>
</html>
