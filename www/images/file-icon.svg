<?xml version="1.0" encoding="UTF-8"?>
<!--
  .rhv file-type icon used by the PWA file_handlers manifest entry.
  Shows a document (folded corner) with the Drakon3D amber mark and an
  ".rhv" label so explorer-style thumbnails read at a glance.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="512" height="512">
  <!-- Document page -->
  <path
    fill="#ffffff"
    stroke="#1f2937"
    stroke-width="1.5"
    stroke-linejoin="round"
    d="M10,4 h22 l8,8 v32 a2,2 0 0 1 -2,2 h-28 a2,2 0 0 1 -2,-2 v-38 a2,2 0 0 1 2,-2 z" />

  <!-- Folded corner -->
  <path
    fill="#e5e7eb"
    stroke="#1f2937"
    stroke-width="1.5"
    stroke-linejoin="round"
    d="M32,4 v8 h8 z" />

  <!-- Drakon3D viewer mark -->
  <g transform="translate(16,18)">
    <path
      fill="#f59e0b"
      d="M14.27,2.40 L9.31,-0.24 a2.4,2.4 0 0 0 -2.06,0 L2.29,2.40
         a2.4,2.4 0 0 0 -1.03,1.78 v5.03 a2.4,2.4 0 0 0 1.03,1.78
         l4.96,2.64 a2.4,2.4 0 0 0 2.06,0 l4.96,-2.64
         a2.4,2.4 0 0 0 1.03,-1.78 V4.18
         a2.4,2.4 0 0 0 -1.03,-1.78 z" />
    <path
      fill="#ffffff"
      d="M13.93,4.69 L9.66,7.15 v4.92 a0.79,0.79 0 1 1 -1.58,0
         v-4.92 L3.82,4.70 a0.79,0.79 0 1 1 0.79,-1.37
         l4.26,2.46 l4.26,-2.46 a0.79,0.79 0 1 1 0.79,1.36 z" />
  </g>

  <!-- ".rhv" label -->
  <text x="24" y="42" font-family="system-ui, -apple-system, sans-serif"
        font-size="6" font-weight="700" text-anchor="middle" fill="#1f2937">.rhv</text>
</svg>
